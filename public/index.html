<!DOCTYPE html>
<html lang="en">
<head>
    <title>Artist search</title>
</head>
<body>
    <h1>Artist explorer</h1>
    <main>
        <h2>Who are you listening to?</h2>
        <p>Find an artist and take a look at their releases.</p>

        <input id="artist-name" type="search" placeholder="Artist name">
        <button id="search-button" type="button">Search</button>

        <ul id="results"></ul>
    </main>
    <!-- Installs Axios -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="/search.js"></script>
</body>
</html>
